<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Portal</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1063/1063231.png">

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; transition: background 0.3s; }
        #setup, #chat { padding: 20px; border-radius: 16px; max-width: 600px; width: 100%; margin: 0 auto; }
        #setup { background: #f2f2f7; color: #000; }
        #chat { display: none; flex-direction: column; height: 100%; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; min-height: 40px; }
        .controls { display: flex; gap: 8px; }
        
        /* THE NAME FIX */
        #display-name { font-weight: bold; font-size: 14px; display: inline-block; }
        .dark-text { color: #ffffff !important; }
        .light-text { color: #000000 !important; }

        .btn-small { font-size: 11px; padding: 6px 10px; border-radius: 8px; border: none; color: white; cursor: pointer; font-weight: bold; }
        .leave-btn { background: #ff3b30; }
        .sound-btn { background: #34c759; }

        input, button { padding: 14px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; -webkit-appearance: none; }
        button { background-color: #007aff; color: white; border: none; cursor: pointer; font-weight: bold; }
        
        #messages { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; }
        .msg-wrapper { display: flex; flex-direction: column; margin-bottom: 12px; max-width: 85%; }
        .my-wrapper { align-self: flex-end; align-items: flex-end; }
        .other-wrapper { align-self: flex-start; align-items: flex-start; }
        .meta { font-size: 11px; opacity: 0.8; margin-bottom: 2px; }
        .message { padding: 8px 14px; border-radius: 18px; word-wrap: break-word; font-size: 15px; }
        
        .input-area { display: flex; gap: 8px; align-items: center; }
        .input-area input { flex-grow: 1; margin-bottom: 0; }
        .img-content { max-width: 100%; border-radius: 12px; margin-top: 4px; display: block; border: 1px solid rgba(255,255,255,0.1); }
        
        #fileInput { display: none; }
        .img-btn { background: #5856d6; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body id="main-body">

    <audio id="ping-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>

    <div id="setup">
        <h2 style="text-align: center;">Secure Portal</h2>
        <input type="text" id="username" placeholder="Identity">
        <input type="text" id="avatar" placeholder="Marker (Emoji)">
        <input type="password" id="groupSecret" placeholder="Access Code">
        <button onclick="joinChat()" style="width:100%;">Initialize</button>
    </div>

    <div id="chat">
        <div class="header">
            <span id="display-name"></span>
            <div class="controls">
                <button id="mute-btn" class="btn-small sound-btn" onclick="toggleSound()">🔊 Audio</button>
                <button class="btn-small leave-btn" onclick="location.reload()">Exit</button>
            </div>
        </div>
        <div id="messages"></div>
        <div class="input-area">
            <label for="fileInput" class="img-btn">🖼️</label>
            <input type="file" id="fileInput" accept="image/*" onchange="processImage(this)">
            <input type="text" id="messageInput" placeholder="Secure comms..." autocomplete="off">
            <button onclick="sendText()" style="padding: 14px 20px;">Send</button>
        </div>
    </div>

    <script>
        let ws; let username; let userAvatar; let cryptoKey; let groupCode;
        let isPrivate = false; let soundEnabled = true; let appActive = false;
        const renderedMessages = new Set();

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById("mute-btn").innerText = soundEnabled ? "🔊 Audio" : "🔇 Muted";
            const audio = document.getElementById("ping-sound");
            audio.play().then(() => { audio.pause(); audio.currentTime = 0; }).catch(e => {});
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible' && appActive) {
                syncHistory();
                if (!ws || ws.readyState !== 1) connectWS();
            }
        });

        async function deriveKey(password) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]);
            return window.crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: enc.encode("secure-chat-salt"), iterations: 100000, hash: "SHA-256" },
                keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
            );
        }

        function applyTheme(isGod) {
            const body = document.getElementById("main-body");
            const msgs = document.getElementById("messages");
            const chatBox = document.getElementById("chat");
            const inputs = document.querySelectorAll("input");
            const nameSpan = document.getElementById("display-name");

            if (isGod) {
                body.style.backgroundColor = "#000000";
                chatBox.style.backgroundColor = "#1c1c1e";
                msgs.style.backgroundColor = "#000";
                nameSpan.className = "dark-text";
                inputs.forEach(i => { i.style.background = "#2c2c2e"; i.style.color = "white"; });
                isPrivate = true;
            } else {
                body.style.backgroundColor = "#ffffff";
                chatBox.style.backgroundColor = "#ffffff";
                msgs.style.backgroundColor = "#f2f2f7";
                nameSpan.className = "light-text";
                isPrivate = false;
            }
        }

        async function encryptData(dataObj) {
            const enc = new TextEncoder();
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const ciphertext = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, cryptoKey, enc.encode(JSON.stringify(dataObj)));
            const combined = new Uint8Array(iv.length + ciphertext.byteLength);
            combined.set(iv); combined.set(new Uint8Array(ciphertext), iv.length);
            return btoa(String.fromCharCode(...combined));
        }

        async function decryptData(base64String) {
            try {
                const combined = new Uint8Array(atob(base64String).split('').map(c => c.charCodeAt(0)));
                const iv = combined.slice(0, 12); const ciphertext = combined.slice(12);
                const decrypted = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, cryptoKey, ciphertext);
                return JSON.parse(new TextDecoder().decode(decrypted));
            } catch (e) { return null; }
        }

        async function syncHistory() {
            if (groupCode !== "GOD") return;
            const res = await fetch('/history');
            const msgs = await res.json();
            for (let m of msgs) {
                const dec = await decryptData(m.ciphertext);
                if (dec) renderMessage(m.id, m.sender, m.avatar, dec.text, dec.time, dec.isImg, m.sender === username);
            }
        }

        async function joinChat() {
            username = document.getElementById("username").value;
            userAvatar = document.getElementById("avatar").value || "👤";
            groupCode = document.getElementById("groupSecret").value;
            if (!username || !groupCode) return;
            cryptoKey = await deriveKey(groupCode);
            applyTheme(groupCode === "GOD");
            document.getElementById("display-name").innerText = `${userAvatar} ${username}`;
            document.getElementById("setup").style.display = "none";
            document.getElementById("chat").style.display = "flex";
            appActive = true;
            await syncHistory(); 
            connectWS();
        }

        function connectWS() {
            const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                syncHistory();
                setInterval(() => { if(ws.readyState === 1) ws.send(JSON.stringify({type:"ping"})); }, 20000);
            };
            ws.onmessage = async (e) => {
                const p = JSON.parse(e.data);
                if (p.type === "delete") { document.getElementById(p.id)?.remove(); return; }
                if (p.type === "message" && p.sender !== username) {
                    const dec = await decryptData(p.ciphertext);
                    if (dec) {
                        renderMessage(p.id, p.sender, p.avatar, dec.text, dec.time, dec.isImg, false);
                        if (soundEnabled) document.getElementById("ping-sound").play().catch(() => {});
                    }
                }
            };
            ws.onclose = () => setTimeout(connectWS, 2000);
        }

        async function sendPayload(content, isImg) {
            if (!ws || ws.readyState !== 1) return;
            const msgId = "msg-" + Date.now();
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const ciphertext = await encryptData({ text: content, isImg: isImg, time: timeStr });
            renderMessage(msgId, username, userAvatar, content, timeStr, isImg, true);
            ws.send(JSON.stringify({ type: "message", id: msgId, sender: username, avatar: userAvatar, ciphertext: ciphertext }));
        }

        function sendText() { 
            const i = document.getElementById("messageInput");
            if (i.value) { sendPayload(i.value, false); i.value = ''; }
        }

        // IMAGE FIX: More robust compression
        function processImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const scale = Math.min(800 / img.width, 800 / img.height, 1);
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        sendPayload(canvas.toDataURL('image/jpeg', 0.6), true);
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(input.files[0]);
                input.value = "";
            }
        }

        function deleteMessage(id) {
            if (confirm("Burn message?")) {
                document.getElementById(id)?.remove();
                ws.send(JSON.stringify({ type: "delete", id: id }));
            }
        }

        function renderMessage(id, sender, avatar, text, time, isImg, isMe) {
            if (renderedMessages.has(id)) return;
            renderedMessages.add(id);
            const div = document.getElementById("messages");
            const wrap = document.createElement("div");
            wrap.id = id;
            wrap.className = `msg-wrapper ${isMe ? 'my-wrapper' : 'other-wrapper'}`;
            wrap.onclick = () => deleteMessage(id);
            let color = isMe ? (isPrivate ? '#0a84ff' : '#007aff') : (isPrivate ? '#3a3a3c' : '#e5e5ea');
            let content = isImg ? `<img src="${text}" class="img-content">` : text;
            wrap.innerHTML = `<div class="meta" style="color:${isPrivate?'#ccc':'#666'}">${avatar} ${sender} • ${time}</div><div class="message" style="background:${color}; color:${isMe||isPrivate?'white':'black'}">${content}</div>`;
            div.appendChild(wrap);
            div.scrollTop = div.scrollHeight;
        }
        document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendText(); });
    </script>
</body>
</html>
