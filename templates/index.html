<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messenger</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3665/3665913.png">

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; transition: background 0.3s; }
        #setup, #chat { padding: 20px; border-radius: 16px; max-width: 600px; width: 100%; margin: 0 auto; }
        #setup { background: #f2f2f7; color: #000; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        #chat { display: none; flex-direction: column; height: 100%; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .controls { display: flex; gap: 8px; }
        .btn-small { font-size: 11px; padding: 6px 10px; border-radius: 8px; border: none; color: white; cursor: pointer; font-weight: bold; }
        .leave-btn { background: #ff3b30; }
        .sound-btn { background: #34c759; }

        input, button { padding: 14px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; -webkit-appearance: none; }
        button { background-color: #007aff; color: white; border: none; cursor: pointer; font-weight: bold; }
        
        #messages { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; }
        .msg-wrapper { display: flex; flex-direction: column; margin-bottom: 12px; max-width: 80%; cursor: pointer; transition: opacity 0.2s; }
        .msg-wrapper:active { opacity: 0.5; }
        .my-wrapper { align-self: flex-end; align-items: flex-end; }
        .other-wrapper { align-self: flex-start; align-items: flex-start; }
        .meta { font-size: 11px; opacity: 0.6; margin-bottom: 2px; }
        .message { padding: 8px 14px; border-radius: 18px; word-wrap: break-word; font-size: 15px; position: relative; }
        
        .input-area { display: flex; gap: 8px; }
        .input-area input { flex-grow: 1; margin-bottom: 0; }
        .gif-img { max-width: 100%; border-radius: 12px; margin-top: 4px; }
    </style>
</head>
<body id="main-body">

    <audio id="ping-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>

    <div id="setup">
        <h2 style="text-align: center;">Messenger</h2>
        <input type="text" id="username" placeholder="Name">
        <input type="text" id="avatar" placeholder="Emoji Avatar">
        <input type="password" id="groupSecret" placeholder="Code">
        <button onclick="joinChat()" style="width:100%;">Continue</button>
    </div>

    <div id="chat">
        <div class="header">
            <span id="display-name" style="font-weight: bold; font-size: 14px;"></span>
            <div class="controls">
                <button id="mute-btn" class="btn-small sound-btn" onclick="toggleSound()">🔊 Sound On</button>
                <button class="btn-small leave-btn" onclick="location.reload()">Leave</button>
            </div>
        </div>
        <div id="messages"></div>
        <div class="input-area">
            <button style="background:#ff375f;" onclick="sendGif()">GIF</button>
            <input type="text" id="messageInput" placeholder="Message..." autocomplete="off">
            <button onclick="sendText()">Send</button>
        </div>
    </div>

    <script>
        let ws; let username; let userAvatar; let cryptoKey; let groupCode;
        let isPrivate = false; let soundEnabled = true; let appActive = false;
        const renderedMessages = new Set();

        // 1. SOUND TOGGLE
        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById("mute-btn").innerText = soundEnabled ? "🔊 Sound On" : "🔇 Muted";
            document.getElementById("mute-btn").style.background = soundEnabled ? "#34c759" : "#8e8e93";
            const audio = document.getElementById("ping-sound");
            audio.play().then(() => { audio.pause(); audio.currentTime = 0; }).catch(e => {});
        }

        // 2. AUTO-REFRESH FIX: Watch for Safari becoming active again
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible' && appActive) {
                console.log("App resumed. Re-syncing...");
                syncHistory();
                if (!ws || ws.readyState !== 1) connectWS();
            }
        });

        async function deriveKey(password) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]);
            return window.crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: enc.encode("secure-chat-salt"), iterations: 100000, hash: "SHA-256" },
                keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
            );
        }

        function applyTheme(isGod) {
            const body = document.getElementById("main-body");
            const msgs = document.getElementById("messages");
            const chatBox = document.getElementById("chat");
            const inputs = document.querySelectorAll("input");
            const displayName = document.getElementById("display-name");

            if (isGod) {
                body.style.backgroundColor = "#000000";
                chatBox.style.backgroundColor = "#1c1c1e";
                msgs.style.backgroundColor = "#000";
                msgs.style.border = "1px solid #3a3a3c";
                displayName.style.color = "#8e8e93";
                inputs.forEach(i => { i.style.background = "#2c2c2e"; i.style.color = "white"; i.style.borderColor = "#3a3a3c"; });
                isPrivate = true;
            } else {
                body.style.backgroundColor = "#ffffff";
                chatBox.style.backgroundColor = "#ffffff";
                msgs.style.backgroundColor = "#f2f2f7";
                msgs.style.border = "1px solid #e5e5ea";
                displayName.style.color = "#8e8e93";
                inputs.forEach(i => { i.style.background = "#ffffff"; i.style.color = "black"; i.style.borderColor = "#ccc"; });
                isPrivate = false;
            }
        }

        async function decryptData(base64String) {
            try {
                const combined = new Uint8Array(atob(base64String).split('').map(c => c.charCodeAt(0)));
                const iv = combined.slice(0, 12); const ciphertext = combined.slice(12);
                const decrypted = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, cryptoKey, ciphertext);
                return JSON.parse(new TextDecoder().decode(decrypted));
            } catch (e) { return null; }
        }

        async function syncHistory() {
            if (groupCode !== "GOD") return;
            try {
                const res = await fetch('/history');
                const msgs = await res.json();
                for (let m of msgs) {
                    const dec = await decryptData(m.ciphertext);
                    if (dec) renderMessage(m.id, m.sender, m.avatar, dec.text, dec.time, dec.isGif, m.sender === username);
                }
            } catch(e) { console.log("Sync failed"); }
        }

        async function joinChat() {
            username = document.getElementById("username").value;
            userAvatar = document.getElementById("avatar").value || "👤";
            groupCode = document.getElementById("groupSecret").value;
            if (!username || !groupCode) return;

            applyTheme(groupCode === "GOD");
            cryptoKey = await deriveKey(groupCode);
            
            document.getElementById("display-name").innerText = `${userAvatar} ${username}`;
            document.getElementById("setup").style.display = "none";
            document.getElementById("chat").style.display = "flex";
            
            appActive = true;
            await syncHistory(); 
            connectWS();
        }

        function connectWS() {
            const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                syncHistory(); 
                setInterval(() => { if(ws.readyState === 1) ws.send(JSON.stringify({type:"ping"})); }, 20000);
            };

            ws.onmessage = async (e) => {
                const payload = JSON.parse(e.data);
                if (payload.type === "delete") {
                    const el = document.getElementById(payload.id);
                    if (el) el.remove();
                    return;
                }
                if (payload.type === "message" && payload.sender !== username) {
                    const dec = await decryptData(payload.ciphertext);
                    if (dec) {
                        renderMessage(payload.id, payload.sender, payload.avatar, dec.text, dec.time, dec.isGif, false);
                        if (soundEnabled) document.getElementById("ping-sound").play().catch(err => {});
                    }
                }
            };

            ws.onclose = () => { if (appActive) setTimeout(connectWS, 2000); };
        }

        async function encryptData(dataObj) {
            const enc = new TextEncoder();
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const ciphertext = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, cryptoKey, enc.encode(JSON.stringify(dataObj)));
            const combined = new Uint8Array(iv.length + ciphertext.byteLength);
            combined.set(iv); combined.set(new Uint8Array(ciphertext), iv.length);
            return btoa(String.fromCharCode(...combined));
        }

        async function sendText() {
            const input = document.getElementById("messageInput");
            if (!input.value || !ws || ws.readyState !== 1) return;
            const msgId = "msg-" + Date.now();
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const ciphertext = await encryptData({ text: input.value, isGif: false, time: timeStr });
            renderMessage(msgId, username, userAvatar, input.value, timeStr, false, true);
            ws.send(JSON.stringify({ type: "message", id: msgId, sender: username, avatar: userAvatar, ciphertext: ciphertext }));
            input.value = '';
        }

        async function sendGif() {
            const url = prompt("Link:");
            if (!url) return;
            const msgId = "msg-" + Date.now();
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const ciphertext = await encryptData({ text: url, isGif: true, time: timeStr });
            renderMessage(msgId, username, userAvatar, url, timeStr, true, true);
            ws.send(JSON.stringify({ type: "message", id: msgId, sender: username, avatar: userAvatar, ciphertext: ciphertext }));
        }

        function deleteMessage(id) {
            if (confirm("Delete for everyone?")) {
                const el = document.getElementById(id);
                if (el) el.remove();
                ws.send(JSON.stringify({ type: "delete", id: id }));
            }
        }

        function renderMessage(id, sender, avatar, text, time, isGif, isMe) {
            if (renderedMessages.has(id)) return;
            renderedMessages.add(id);
            const div = document.getElementById("messages");
            const wrap = document.createElement("div");
            wrap.id = id;
            wrap.className = `msg-wrapper ${isMe ? 'my-wrapper' : 'other-wrapper'}`;
            wrap.onclick = () => deleteMessage(id);
            
            let color = isMe ? (isPrivate ? '#0a84ff' : '#007aff') : (isPrivate ? '#3a3a3c' : '#e5e5ea');
            let txtColor = isMe || isPrivate ? 'white' : 'black';
            let content = isGif ? `<img src="${text}" class="gif-img">` : text;
            wrap.innerHTML = `<div class="meta">${avatar} ${sender} • ${time}</div><div class="message" style="background:${color}; color:${txtColor}; border:${(!isPrivate && !isMe)?'1px solid #ccc':'none'}">${content}</div>${isMe ? `<div style="font-size:10px; color:#8e8e93; margin-top:2px;">Sent</div>` : ''}`;
            div.appendChild(wrap);
            div.scrollTop = div.scrollHeight;
        }
        document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendText(); });
    </script>
</body>
</html>
